steps:
  - name: "Canvas létrehozása (P0-1 specifikáció)"
    description: >
      Hozd létre a P0-1 feladathoz tartozó canvas-t a repó szabvány szerint, és töltsd ki
      a cél/nem-cél, érintett fájlok, DoD, kockázat/rollback, teszt terv részeket.
      Kötelező szekciók: 🎯 Funkció, 🧠 Fejlesztési részletek, 🧪 Tesztállapot, 🌍 Lokalizáció, 📎 Kapcsolódások.
    outputs:
      - "canvases/ci/ci_github_actions_flutter_gate.md"

  - name: "verify.sh futtathatóvá tétele (executable bit)"
    description: >
      A scripts/verify.sh-nek futtathatónak kell lennie `./scripts/verify.sh` formában.
      Ha nem az, állítsd be executable-re és rögzítsd gitben is (chmod +x scripts/verify.sh).
      Ellenőrzés (nem közvetlen flutter!): `./scripts/verify.sh --help` sikeresen fusson.
      A fájl tartalmát nem kell átírni, csak a futtathatóságot javítsd.
    outputs:
      - "scripts/verify.sh"

  - name: "GitHub Actions CI workflow létrehozása"
    description: >
      Hozd létre a `.github/workflows/ci.yml` workflow-t, ami PR/push esetén fut, és a minimum gate-et adja:
      `./scripts/check.sh`.
      Ne használj semmilyen secretet. Ne add hozzá Supabase kulcsokat. A workflow célja csak a check.sh futtatása.
      A job neve legyen stabil, hogy branch protectionnél könnyen kiválasztható legyen.

      A fájl teljes tartalma legyen pontosan ez:

      ```yaml
      name: CI

      on:
        pull_request:
        push:
        workflow_dispatch:

      concurrency:
        group: ci-${{ github.ref }}
        cancel-in-progress: true

      permissions:
        contents: read

      jobs:
        flutter_gate:
          name: Flutter gate (check.sh)
          runs-on: ubuntu-latest
          timeout-minutes: 20

          steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: stable
                cache: true

            - name: Run repo quality gate
              run: ./scripts/check.sh
      ```
    outputs:
      - ".github/workflows/ci.yml"

  - name: "Codex checklist + report váz létrehozása"
    description: >
      Hozd létre a checklistet és a report vázat a szabvány szerint.

      1) Checklist: legyen pipálható DoD lista (a canvas DoD pontjai 1:1-ben).
         File: codex/codex_checklist/ci/ci_github_actions_flutter_gate.md

      2) Report váz: kövesd a `docs/codex/report_standard.md` szerkezetét (Report Standard v2).
         A report elején legyen státusz (kezdetben legyen FAIL, amíg nincs verify futás).
         Tartalmazzon egy üres/placeholder AUTO_VERIFY blokkot is (a verify.sh úgyis felülírja / hozzáadja).
         File: codex/reports/ci/ci_github_actions_flutter_gate.md
    outputs:
      - "codex/codex_checklist/ci/ci_github_actions_flutter_gate.md"
      - "codex/reports/ci/ci_github_actions_flutter_gate.md"

  - name: "Repo gate (automatikus verify) + report/checklist zárás"
    description: >
      Futtasd a standard ellenőrzést a wrapperen keresztül:
      `./scripts/verify.sh --report codex/reports/ci/ci_github_actions_flutter_gate.md`

      Ez létrehozza a logot és frissíti a report AUTO_VERIFY blokkját:
      `codex/reports/ci/ci_github_actions_flutter_gate.verify.log`

      Ezután:
      - Ha a verify PASS: állítsd a report státuszt PASS-ra, töltsd ki röviden a Change summary-t,
        és a DoD → Evidence Matrix táblát (útvonal + line range) a létrehozott/módosított fájlokra.
        Pipáld ki a checklist releváns pontjait.
      - Ha a verify FAIL: hagyd FAIL-on a reportot, a DoD Evidence-ben jelöld a nem teljesült pontokat,
        és a Follow-ups részben írj konkrét javítási javaslatot (1–5 bullet). Checklistben ne pipálj hazudva.

      Fontos: ne futtass közvetlen `flutter ...` parancsokat; csak a wrapperen keresztül menjen a gate.
    outputs:
      - "codex/reports/ci/ci_github_actions_flutter_gate.md"
      - "codex/reports/ci/ci_github_actions_flutter_gate.verify.log"
      - "codex/codex_checklist/ci/ci_github_actions_flutter_gate.md"
