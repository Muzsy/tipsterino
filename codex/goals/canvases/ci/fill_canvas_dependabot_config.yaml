# FILE: codex/goals/canvases/ci/fill_canvas_dependabot_config.yaml

steps:
  - name: "Canvas létrehozása (P1-5 specifikáció)"
    description: >
      Hozd létre a P1-5 feladathoz tartozó canvas-t a repó szabvány szerint.
      Kötelező szekciók: 🎯 Funkció, 🧠 Fejlesztési részletek, 🧪 Tesztállapot, 🌍 Lokalizáció, 📎 Kapcsolódások.
    outputs:
      - "canvases/ci/dependabot_config.md"

  - name: "Dependabot konfiguráció létrehozása (.github/dependabot.yml)"
    description: >
      Hozd létre a .github/dependabot.yml fájlt a GitHub Dependabot v2 formátumban.

      Kötelező blokkok:
      1) github-actions:
         - directory: "/"
         - schedule: weekly (hétfő)
         - labels: ["dependencies", "ci"]

      2) pub:
         - directory: "/app"
         - schedule: weekly (hétfő)
         - labels: ["dependencies", "flutter"]

      Minimális, működő config legyen; ne találj ki extra ignore szabályokat, hacsak a repo-ban nincs explicit policy.
    outputs:
      - ".github/dependabot.yml"

  - name: "Codex checklist + report váz létrehozása"
    description: >
      Hozd létre a feladathoz a checklistet és a report vázat a szabvány szerint.

      1) Checklist:
         - File: codex/codex_checklist/ci/dependabot_config.md
         - pipálható DoD lista a canvas DoD pontjai alapján.

      2) Report váz:
         - File: codex/reports/ci/dependabot_config.md
         - kövesd a docs/codex/report_standard.md szerkezetét (Report Standard v2).
         - kezdeti státusz: FAIL (amíg nem fut verify)
         - legyen benne AUTO_VERIFY marker blokk (verify.sh frissíti)
    outputs:
      - "codex/codex_checklist/ci/dependabot_config.md"
      - "codex/reports/ci/dependabot_config.md"

  - name: "Repo gate (automatikus verify) + report/checklist zárás"
    description: >
      Futtasd a standard repo ellenőrzést és rögzítsd a reportban:

      Parancs:
      ./scripts/verify.sh --report codex/reports/ci/dependabot_config.md

      Elvárt:
      - létrejön/frissül: codex/reports/ci/dependabot_config.verify.log
      - a report AUTO_VERIFY blokkja frissül
      - PASS esetén: report státusz PASS (vagy PASS_WITH_NOTES), Change summary + DoD→Evidence Matrix kitöltve
      - checklistben csak a valós, bizonyított pontok legyenek kipipálva
    outputs:
      - "codex/reports/ci/dependabot_config.md"
      - "codex/reports/ci/dependabot_config.verify.log"
      - "codex/codex_checklist/ci/dependabot_config.md"
