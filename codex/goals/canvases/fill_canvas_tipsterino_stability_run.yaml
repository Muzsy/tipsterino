steps:
  - name: Dokumentációs hivatkozások átnézése
    description: >
      Igazítsd a `canvases/`, `codex/`, `documents/` és `docs/` fájlok hivatkozásait, hogy minden `app/...` artefakt valós legyen, és nem maradt `.env` logika csak `--dart-define`.
      Helyezd el szükséges frissítések a `documents/supabase_configuration.md`, `documents/app_architecture.md` és `docs/README.md` fájlokban.
    outputs:
      - "canvases/tipsterino_stability_run.md"
      - "documents/app_architecture.md"
      - "documents/supabase_configuration.md"
      - "docs/README.md"
  - name: `--dart-define` Supabase flow és l10n
    description: >
      Vezesd be a `--dart-define` alapján beolvasott `SUPABASE_URL`/`SUPABASE_ANON_KEY` értékeket, távolítsd el a `flutter_dotenv` dependency-t és `.env` logikát, és frissítsd a `app/lib/l10n` üzeneteket, hogy az offline állapotnál a gombok disabled és a lokalizáció a `--dart-define` folyamatot írja le.
    outputs:
      - "app/lib/main.dart"
      - "app/pubspec.yaml"
      - "app/pubspec.lock"
      - "app/lib/l10n/app_en.arb"
      - "app/lib/l10n/app_hu.arb"
      - "app/lib/l10n/app_localizations.dart"
  - name: Teszt + ellenőrzés
    description: >
      Stabilizáld az integration tesztet (offline és konfigurált állapot), ellenőrizd a widget/l10n teszteket, majd futtasd `cd app && dart format .`, `cd app && flutter analyze`, `cd app && flutter test` és `cd app && flutter test integration_test -d <deviceId>` parancsokat; dokumentáld az eredményeket checklistben és reportban.
    outputs:
      - "app/test/widget/app_smoke_test.dart"
      - "app/test/widget/l10n_test.dart"
      - "app/integration_test/app_test.dart"
      - "codex/codex_checklist/tipsterino_stability_run.md"
      - "codex/reports/tipsterino_stability_run.md"
