steps:
  - name: "Canvas veglegesitese"
    description: >
      Frissitsd a task canvasat valos setup es script hivatkozasokkal,
      valamint commit-safe secret szabalyokkal.
    outputs:
      - "canvases/audit_p0/production_secret_management_docs.md"

  - name: "Secret management doksi letrehozasa"
    description: >
      Hozd letre a `docs/setup/secret_management.md` fajlt, amely tartalmazza
      a dev/stage/prod secret flow-t, CI secret beallitasokat es tiltott kulcslistat.
    outputs:
      - "docs/setup/secret_management.md"

  - name: "Setup es README hivatkozasok frissitese"
    description: >
      Frissitsd a `docs/setup/dev_setup.md` es `README.md` fajlokat,
      hogy hivatkozzanak a secret management dokumentumra.
      Frissitsd az `app/.env.example` kommenteket a commit-safe szabalyok szerint.
    outputs:
      - "docs/setup/dev_setup.md"
      - "README.md"
      - "app/.env.example"

  - name: "Checklist es report scaffold"
    description: >
      Keszitsd el a checklistet es reportot a report standard szerkezeteben.
    outputs:
      - "codex/codex_checklist/audit_p0/production_secret_management_docs.md"
      - "codex/reports/audit_p0/production_secret_management_docs.md"

  - name: "Repo gate (automatikus verify)"
    description: >
      Futtasd:
      ./scripts/verify.sh --report codex/reports/audit_p0/production_secret_management_docs.md
    outputs:
      - "codex/reports/audit_p0/production_secret_management_docs.md"
      - "codex/reports/audit_p0/production_secret_management_docs.verify.log"
      - "codex/codex_checklist/audit_p0/production_secret_management_docs.md"
