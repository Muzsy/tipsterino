steps:
  - name: Dokumentációs & canvas alapok
    description: >
      Ellenőrizd, hogy a `canvases/`, `codex/` és `documents/` fájlok már csak létező `app/...` artefaktokra hivatkoznak, és hogy nem maradt `.env` utalás a Supabase konfigurációra.
      Dokumentáld az új architektúrát és környezeti elvárásokat (`documents/app_architecture.md`, `documents/supabase_configuration.md`), ha szükséges.
    outputs:
      - "canvases/tipsterino_foundation_bootstrap.md"
      - "codex/goals/canvases/fill_canvas_tipsterino_foundation_bootstrap.yaml"
      - "documents/app_architecture.md"
  - name: Tipsterino app foundation + Supabase auth
    description: >
      Építsd fel vagy igazítsd az `app/` Flutter appot go_router + Riverpod + Material3 stackkel, Supabase init guarddal és a `--dart-define` definíciókkal.
      Biztosítsd, hogy a Supabase csak akkor inicializálódik, ha mindkét define megvan, és az auth UI offline módban disabled gombokat és üzenetet mutat.
    outputs:
      - "app/lib/main.dart"
      - "app/lib/src/app.dart"
      - "app/lib/src/router/app_router.dart"
      - "app/lib/src/providers/auth_provider.dart"
      - "app/lib/src/providers/supabase_provider.dart"
      - "app/lib/src/screens/**"
      - "app/lib/src/theme/app_theme.dart"
      - "app/lib/l10n/app_en.arb"
      - "app/lib/l10n/app_hu.arb"
      - "app/lib/l10n/app_localizations.dart"
  - name: Tesztek és gate
    description: >
      Adj hozzá widget + l10n teszteket és integration smoke-ot, majd futtasd `cd app && dart format .`, `cd app && flutter analyze`, `cd app && flutter test` és a `cd app && flutter test integration_test/app_test.dart -d <deviceId>` parancsokat.
      Dokumentáld az eredményeket checklistben és reportban.
    outputs:
      - "app/test/widget/app_smoke_test.dart"
      - "app/test/widget/l10n_test.dart"
      - "app/integration_test/app_test.dart"
      - "codex/codex_checklist/tipsterino_foundation_bootstrap.md"
      - "codex/reports/tipsterino_foundation_bootstrap.md"
