steps:
  - name: "Canvas létrehozása (P1-1 specifikáció)"
    description: >
      Hozd létre a P1-1 feladathoz tartozó canvas-t a repó szabvány szerint, és töltsd ki.
      Kötelező szekciók: 🎯 Funkció, 🧠 Fejlesztési részletek, 🧪 Tesztállapot, 🌍 Lokalizáció, 📎 Kapcsolódások.
    outputs:
      - "canvases/docs/docs_consolidation_docs_vs_documents.md"

  - name: "documents/ → docs/ migráció (minimum 3 kritikus doksi) + stubok"
    description: >
      Migráld át a docs által hivatkozott 3 kritikus dokumentumot a docs/ alá, és a régi helyükön hagyj
      egyértelmű DEPRECATED stubot, ami az új útvonalra mutat.

      Kötelező mapping:
      - documents/app_architecture.md -> docs/architect/app_architecture.md
      - documents/supabase_configuration.md -> docs/setup/supabase_configuration.md
      - documents/bonus_system/daily_bonus.md -> docs/core_logic/daily_bonus.md

      Fontos:
      - Az átemelt tartalomban javítsd a valós repó útvonalakat (ne inventálj).
      - A futtatási/teszt parancsoknál a wrapper legyen az irányadó: ./scripts/flutter.sh ...
      - A régi documents/* fájlokban maradjon csak rövid stub + link az új docs/* fájlra (ne duplikáld vissza a teljes tartalmat).
    outputs:
      - "docs/architect/app_architecture.md"
      - "docs/setup/supabase_configuration.md"
      - "docs/core_logic/daily_bonus.md"
      - "documents/app_architecture.md"
      - "documents/supabase_configuration.md"
      - "documents/bonus_system/daily_bonus.md"

  - name: "documents deprecációs belépő (index + szabályok)"
    description: >
      Hozd létre a documents/README_DEPRECATED.md fájlt.
      Tartalmazza:
      - hogy a docs/ a canonical,
      - hogy a documents/ deprecated/archív,
      - és egy mapping táblát a kulcs docokhoz (legalább a 3 migrált doksi).
      Rövid, végrehajtható szabályokkal (pl. 'új tartalom csak docs/ alá').
    outputs:
      - "documents/README_DEPRECATED.md"

  - name: "Hivatkozások átvezetése (docs/ canonical rögzítése)"
    description: >
      Vezesd át a hivatkozásokat úgy, hogy sehol ne legyen a documents/ “naprakész forrásként” kezelve.

      Kötelezően frissítendő:
      - README.md (root): docs/ legyen a dokumentáció fő belépő; documents/ deprecatedként szerepeljen.
      - AGENTS.md:
        - Repo gyors térképben jelöld a documents/ mappát deprecatedként.
        - Forrás-igazság prioritásban a docs/ kerüljön a documents/ elé.
      - docs/README.md: a Kapcsolódó anyagok az új docs/* útvonalakra mutassanak.
      - docs/architect/project_structure.md: documents/ említések/linkek az új docs/* útvonalakra mutassanak, és a documents/ deprecatedként legyen megemlítve.
      - docs/core_logic/bonus_system.md: daily bonus link az új docs/core_logic/daily_bonus.md-re mutasson.

      Plusz: keress rá a docs/ alatt "documents/" előfordulásokra, és ahol indokolt, vezesd át.
    outputs:
      - "README.md"
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/architect/project_structure.md"
      - "docs/core_logic/bonus_system.md"

  - name: "Codex checklist + report váz létrehozása"
    description: >
      Hozd létre a checklistet és a report vázat a szabvány szerint.

      1) Checklist: legyen pipálható DoD lista (a canvas DoD pontjai 1:1-ben).
         File: codex/codex_checklist/docs/docs_consolidation_docs_vs_documents.md

      2) Report váz: kövesd a docs/codex/report_standard.md szerkezetét (Report Standard v2).
         Kezdetben FAIL státusz (amíg nincs verify futás).
         Legyen benne placeholder AUTO_VERIFY blokk (a verify.sh úgyis felülírja).
         File: codex/reports/docs/docs_consolidation_docs_vs_documents.md
    outputs:
      - "codex/codex_checklist/docs/docs_consolidation_docs_vs_documents.md"
      - "codex/reports/docs/docs_consolidation_docs_vs_documents.md"

  - name: "Repo gate (automatikus verify) + report/checklist zárás"
    description: >
      Futtasd a standard ellenőrzést:
      `./scripts/verify.sh --report codex/reports/docs/docs_consolidation_docs_vs_documents.md`

      Ez létrehozza a logot és frissíti a report AUTO_VERIFY blokkját:
      `codex/reports/docs/docs_consolidation_docs_vs_documents.verify.log`

      Ezután:
      - Verify PASS esetén: report státusz PASS vagy PASS_WITH_NOTES, töltsd a Change summary-t,
        és a DoD → Evidence Matrix táblát (útvonal + line range). Pipáld a checklistet.
      - Verify FAIL esetén: report marad FAIL, Evidence-ben jelöld a hiányzó pontokat,
        Follow-ups-ban adj konkrét javítási lépéseket. Checklistben ne pipálj hazudva.
    outputs:
      - "codex/reports/docs/docs_consolidation_docs_vs_documents.md"
      - "codex/reports/docs/docs_consolidation_docs_vs_documents.verify.log"
      - "codex/codex_checklist/docs/docs_consolidation_docs_vs_documents.md"
