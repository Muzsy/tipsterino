steps:
  - name: "Widget teszt: Events inbox data flow (initial load + refresh + loadMore + markRead)"
    description: >
      Hozd létre az új widget tesztet, ami a /events fő működési útvonalait bizonyítja.

      Fájl: app/test/widget/events_inbox_data_flow_test.dart

      Követelmények:
      - Használd a meglévő mintát: ProviderScope(overrides) + TipsterinoApp()
      - Override-ok:
        * authNotifierProvider -> AuthNotifier(ref, initialState: AuthViewState(status: authenticated), autoListen:false)
        * userEventsRepositoryProvider -> FakeUserEventsRepository instance (extends UserEventsRepository)
        * supabaseConfigProvider maradhat isConfigured:false (nem számít, mert a repo provider override-olva van)

      Fake repo:
      - extends UserEventsRepository
      - dummy SupabaseClient('http://localhost', 'anon') a super-nek
      - fetchPage: logolja az offsetet, és offset alapján adja vissza az előre beállított listákat
      - markRead: logolja az id-ket

      Tesztesetek:

      1) "Initial load shows signup bonus and fetches page 0"
         - page(0) -> 1 event: type=tippcoin_credit, code=signup_bonus, amount=100, readAt=null
         - router.go('/events')
         - pumpAndSettle után:
           * expect loc.eventSignupBonusTitle
           * expect loc.eventSignupBonusBody('100')
           * expect fake.fetchOffsets contains 0

      2) "RefreshIndicator present and AppBar refresh triggers fetch again"
         - page(0) -> 1 event (ugyanaz)
         - navigálj /events-re, pumpAndSettle
         - expect find.byType(RefreshIndicator) == 1
         - keresd meg a refresh gombot rugalmasan:
           * ha van Icons.refresh -> tap
           * else ha van Icons.refresh_outlined -> tap
           * különben fail (expect findsAtLeast(1) a végén)
         - pumpAndSettle után expect fake.fetchOffsets == [0, 0] (vagy legalább két darab 0)

      3) "Scrolling near end triggers loadMore (fetch page 20)"
         - page(0) -> 20 event (különböző id-k, hogy scroll legyen)
         - page(20) -> 1 event
         - navigálj /events-re, pumpAndSettle
         - görgess a lista végéhez (fling/drag), pumpAndSettle
         - expect fake.fetchOffsets contains 20

      4) "MarkRead is idempotent (called once)"
         - page(0) -> 1 unread event id='e1'
         - navigálj /events-re, pumpAndSettle
         - tap a tile-on (find.text(loc.eventSignupBonusTitle))
         - pumpAndSettle
         - expect fake.markReadIds == ['e1']
         - tap újra ugyanarra a tile-ra
         - pumpAndSettle
         - expect fake.markReadIds továbbra is csak 1 elem

      Tipp:
      - A /events képernyő initState microtask loadInitial miatt szükség lehet extra pump()-ra a router.go után.
    outputs:
      - "app/test/widget/events_inbox_data_flow_test.dart"

  - name: "Codex checklist + report (events inbox test coverage)"
    description: >
      Készíts checklistet és reportot ehhez a tesztbővítés taskhoz.

      Checklist tartalmazza:
      - új widget teszt fájl létrejött
      - initial load + mapping ellenőrzés
      - refresh (RefreshIndicator + AppBar refresh) ellenőrzés
      - loadMore scroll trigger ellenőrzés
      - markRead idempotencia ellenőrzés

      Report tartalmazza:
      - rövid összegzés a fake repo megközelítésről (miért kell extends UserEventsRepository)
      - a 4 teszteset röviden
      - futtatott parancsok és PASS státusz
    outputs:
      - "codex/codex_checklist/bonus_system/bonus_system_events_inbox_ui_test_coverage.md"
      - "codex/reports/bonus_system/bonus_system_events_inbox_ui_test_coverage.md"

  - name: "Repo gate"
    description: >
      Futtasd: ./scripts/check.sh

      A PASS státuszt és a lényeges összegzést írd bele a reportba.
    outputs:
      - "codex/reports/bonus_system/bonus_system_events_inbox_ui_test_coverage.md"
