name: CI - DB

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db_contract_checks:
    name: DB contract checks (sql_checks)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start Supabase local stack
        run: |
          supabase start --no-attach
          # wait for stack to be healthy
          for i in {1..20}; do
            supabase status >/dev/null 2>&1 && break
            sleep 3
          done
          supabase status

      - name: Reset local DB (apply migrations; no seed)
        run: |
          supabase db reset --local --no-seed
          sleep 5

      - name: Run DB contract checks (sql_checks)
        run: |
          ./scripts/check_db.sh
      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
