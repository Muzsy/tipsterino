name: CI - DB

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db_contract_checks:
    name: DB contract checks (sql_checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          flutter-version: 3.41.5
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1.6.0
        with:
          version: 2.65.5

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev lld

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset local DB (apply migrations; no seed)
        run: supabase db reset --local --no-seed

      - name: Run DB contract checks (sql_checks)
        run: ./scripts/check_db.sh

      - name: Prepare app/.env for integration tests
        shell: bash
        run: |
          set -euo pipefail

          STATUS_JSON="$(supabase status --output json || true)"
          RESOLVED_KEYS="$(
            STATUS_JSON="$STATUS_JSON" python3 - <<'PY'
          import json
          import os

          try:
              data = json.loads(os.environ.get("STATUS_JSON", "{}"))
          except Exception:
              data = {}

          def pick(*keys: str) -> str:
              for key in keys:
                  value = data.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()
              return ""

          print(pick("API_URL", "api_url"))
          print(pick("ANON_KEY", "anon_key"))
          print(pick("SERVICE_ROLE_KEY", "service_role_key"))
          PY
          )"

          API_URL="$(printf '%s\n' "$RESOLVED_KEYS" | sed -n '1p')"
          ANON_KEY="$(printf '%s\n' "$RESOLVED_KEYS" | sed -n '2p')"
          SERVICE_ROLE_KEY="$(printf '%s\n' "$RESOLVED_KEYS" | sed -n '3p')"

          if [[ -z "$API_URL" || -z "$ANON_KEY" || -z "$SERVICE_ROLE_KEY" ]]; then
            echo "ERROR: Failed to resolve API_URL/ANON_KEY/SERVICE_ROLE_KEY from supabase status."
            exit 1
          fi

          BONUS_TEST_EMAIL="bonus-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          BONUS_TEST_PASSWORD="ValidP@ss1"
          BONUS_RATE_LIMIT_TEST_EMAIL="bonus-rate-limit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          BONUS_RATE_LIMIT_TEST_PASSWORD="ValidP@ss1"
          export API_URL ANON_KEY SERVICE_ROLE_KEY BONUS_TEST_EMAIL BONUS_TEST_PASSWORD BONUS_RATE_LIMIT_TEST_EMAIL BONUS_RATE_LIMIT_TEST_PASSWORD

          # CI-only provisioning avoids flaky signup email rate-limits in integration tests.
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api_url = os.environ["API_URL"]
          service_role_key = os.environ["SERVICE_ROLE_KEY"]
          anon_key = os.environ["ANON_KEY"]

          users = [
              (
                  os.environ["BONUS_TEST_EMAIL"],
                  os.environ["BONUS_TEST_PASSWORD"],
                  "ci_bonus_user",
              ),
              (
                  os.environ["BONUS_RATE_LIMIT_TEST_EMAIL"],
                  os.environ["BONUS_RATE_LIMIT_TEST_PASSWORD"],
                  "ci_bonus_rl_user",
              ),
          ]

          for email, password, nickname in users:
              payload = json.dumps(
                  {
                      "email": email,
                      "password": password,
                      "email_confirm": True,
                      "user_metadata": {
                          "nickname": nickname,
                          "avatar_key": "default",
                      },
                  }
              ).encode("utf-8")

              create_request = urllib.request.Request(
                  url=f"{api_url}/auth/v1/admin/users",
                  data=payload,
                  headers={
                      "apikey": service_role_key,
                      "Authorization": f"Bearer {service_role_key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(create_request) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(
                          f"Failed provisioning bonus integration user: HTTP {response.status}"
                      )

              signin_payload = json.dumps(
                  {
                      "email": email,
                      "password": password,
                  }
              ).encode("utf-8")

              signin_request = urllib.request.Request(
                  url=f"{api_url}/auth/v1/token?grant_type=password",
                  data=signin_payload,
                  headers={
                      "apikey": anon_key,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(signin_request) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"Provisioned user sign-in failed: HTTP {response.status}"
                      )
          PY

          cat > app/.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          EOF

          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BONUS_TEST_EMAIL=$BONUS_TEST_EMAIL"
            echo "BONUS_TEST_PASSWORD=$BONUS_TEST_PASSWORD"
            echo "BONUS_RATE_LIMIT_TEST_EMAIL=$BONUS_RATE_LIMIT_TEST_EMAIL"
            echo "BONUS_RATE_LIMIT_TEST_PASSWORD=$BONUS_RATE_LIMIT_TEST_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run bonus RPC integration test (core reasons)
        run: |
          ./scripts/flutter.sh test integration_test/bonus_rpc_integration_test.dart -d linux \
            --plain-name="Signup and daily bonus RPC reasons stay deterministic" \
            --dart-define=BONUS_TEST_EMAIL="${BONUS_TEST_EMAIL}" \
            --dart-define=BONUS_TEST_PASSWORD="${BONUS_TEST_PASSWORD}"

      - name: Run bonus RPC integration test (rate_limited branch)
        run: |
          ./scripts/flutter.sh test integration_test/bonus_rpc_integration_test.dart -d linux \
            --plain-name="Bonus RPC rate_limited branch stays deterministic" \
            --dart-define=BONUS_RATE_LIMIT_TEST_EMAIL="${BONUS_RATE_LIMIT_TEST_EMAIL}" \
            --dart-define=BONUS_RATE_LIMIT_TEST_PASSWORD="${BONUS_RATE_LIMIT_TEST_PASSWORD}"
